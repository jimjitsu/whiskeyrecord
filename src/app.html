<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#f5efe0" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#15110d" media="(prefers-color-scheme: dark)" />
		<meta
			name="description"
			content="Keep a record of every whiskey you've tried or want to try."
		/>
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
		<title>Whiskey Record</title>
		<script>
			// Apply the theme picked in Settings before anything draws (see lib/theme.svelte.ts).
			try {
				var t = localStorage.getItem('whiskey-record:theme');
				if (t === 'light' || t === 'dark') {
					document.documentElement.dataset.theme = t;
					document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
						m.content = t === 'dark' ? '#15110d' : '#f5efe0';
					});
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
