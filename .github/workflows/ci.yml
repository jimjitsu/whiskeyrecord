name: CI

# Runs on every push and pull request. Cloudflare still deploys main on its
# own, so a red run here is the signal to fix before testers hit the problem.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          PUBLIC_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
